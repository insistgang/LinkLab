include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "admin_dashboard/**"
    # AGENTS.md §1 / §3 / §4.2：
    # 競賽版 analyze 默認只收斂 MVP 主鏈路，已隔離的實驗/歷史模塊不再阻塞交付。
    - "lib/admin/**"
    - "lib/screens/archive/**"
    - "lib/services/archive/**"
    - "lib/pages/call/**"
    - "lib/screens/community/**"
    - "lib/screens/home/community_screen.dart"
    - "lib/screens/call/async_help_request_screen.dart"
    - "lib/screens/call/call_screen.dart"
    - "lib/screens/call/matching_screen.dart"
    - "lib/screens/call/real_call_screen.dart"
    - "lib/screens/call/sos_screen.dart"
    - "lib/screens/security/**"
    - "lib/screens/user_center/**"
    - "lib/demo_flow/demo_flow_controller.dart"
    - "lib/demo_flow/demo_matching_flow.dart"
    - "lib/demo_flow/demo_sos_flow.dart"
    - "lib/models/timeline_model.dart"
    - "lib/services/ai/**"
    - "lib/services/ai_service.dart"
    - "lib/services/community/**"
    - "lib/services/experimental/**"
    - "lib/services/real_call_service.dart"
    - "lib/services/real_matching_service.dart"
    - "lib/services/sos_service.dart"
    - "lib/services/demo/demo_webrtc_service.dart"
    - "lib/services/security/authentication_service.dart"
    - "lib/services/security/blacklist_service.dart"
    - "lib/services/security/call_recording_service.dart"
    - "lib/services/security/content_detection_service.dart"
    - "lib/services/security/credit_score_service.dart"
    - "lib/services/security/rating_service.dart"
    - "lib/services/security/report_service.dart"
    - "lib/services/user_center/async_task_service.dart"
    - "lib/services/user_center/badge_service.dart"
    - "lib/services/user_center/points_service.dart"
    - "lib/services/user_center/schedule_service.dart"
    - "lib/services/user_center/skill_tag_service.dart"
    - "lib/services/user_center/timeline_service.dart"
    - "lib/services/user_center/volunteer_level_service.dart"
    - "lib/services/webrtc/**"
    - "lib/services/webrtc_service.dart"
  errors:
    invalid_annotation_target: ignore
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # 代碼風格
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_fields: true
    prefer_final_locals: true
    avoid_print: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true

    # 命名規範
    constant_identifier_names: true
    file_names: true
    package_names: true

    # 類型安全
    always_specify_types: false
    avoid_dynamic_calls: true

    # 性能
    avoid_slow_async_io: true
    avoid_unused_constructor_parameters: true
