<svg xmlns="http://www.w3.org/2000/svg" width="1169" height="827" viewBox="0 0 1169 827">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,6 L9,3 z" fill="#333"/>
</marker>
<style>
.title { font: bold 22px SimSun, "Times New Roman", serif; fill:#111; }
.subtitle { font: 13px SimSun, "Times New Roman", serif; fill:#555; }
.boxtext { font: 14px SimSun, "Times New Roman", serif; fill:#111; }
.smalltext { font: 12px "Times New Roman", SimSun, serif; fill:#111; }
.notetext { font: 12px SimSun, "Times New Roman", serif; fill:#111; }
</style>
</defs>
<rect x="0" y="0" width="1169" height="827" fill="white"/>

<text x="590.0" y="40.0" class="title" text-anchor="middle" dominant-baseline="middle">图3 StudentModel 学生模型架构</text>
<text x="585.0" y="74.0" class="subtitle" text-anchor="middle" dominant-baseline="middle">极简轻量学生网络：浅层卷积特征 + 线性分类头，用于知识蒸馏后的部署</text>
<rect x="395" y="110" width="380" height="56" rx="8" fill="#E6E6E6" stroke="#222" stroke-width="1.2"/>
<text x="585.0" y="129.5" class="boxtext" text-anchor="middle" dominant-baseline="middle" font-weight="bold">输入</text>
<text x="585.0" y="146.5" class="boxtext" text-anchor="middle" dominant-baseline="middle">[batch, side, side]</text>
<rect x="395" y="190" width="380" height="56" rx="8" fill="#F8F8F8" stroke="#222" stroke-width="1.2"/>
<text x="585.0" y="209.5" class="boxtext" text-anchor="middle" dominant-baseline="middle">Reshape</text>
<text x="585.0" y="226.5" class="boxtext" text-anchor="middle" dominant-baseline="middle">[batch, 1, side, side]</text>
<line x1="585.0" y1="166" x2="585.0" y2="190" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="395" y="270" width="380" height="56" rx="8" fill="#F8F8F8" stroke="#222" stroke-width="1.2"/>
<text x="585.0" y="289.5" class="boxtext" text-anchor="middle" dominant-baseline="middle">Conv2d</text>
<text x="585.0" y="306.5" class="boxtext" text-anchor="middle" dominant-baseline="middle">1 → 4，3×3，padding = 1</text>
<line x1="585.0" y1="246" x2="585.0" y2="270" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="395" y="350" width="380" height="56" rx="8" fill="#F8F8F8" stroke="#222" stroke-width="1.2"/>
<text x="585.0" y="378.0" class="boxtext" text-anchor="middle" dominant-baseline="middle">ReLU</text>
<line x1="585.0" y1="326" x2="585.0" y2="350" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="395" y="430" width="380" height="56" rx="8" fill="#F8F8F8" stroke="#222" stroke-width="1.2"/>
<text x="585.0" y="449.5" class="boxtext" text-anchor="middle" dominant-baseline="middle">Dropout</text>
<text x="585.0" y="466.5" class="boxtext" text-anchor="middle" dominant-baseline="middle">p = 0.1</text>
<line x1="585.0" y1="406" x2="585.0" y2="430" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="395" y="510" width="380" height="56" rx="8" fill="#F8F8F8" stroke="#222" stroke-width="1.2"/>
<text x="585.0" y="529.5" class="boxtext" text-anchor="middle" dominant-baseline="middle">Flatten</text>
<text x="585.0" y="546.5" class="boxtext" text-anchor="middle" dominant-baseline="middle">[batch, 4×side²]</text>
<line x1="585.0" y1="486" x2="585.0" y2="510" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="395" y="590" width="380" height="56" rx="8" fill="#F8F8F8" stroke="#222" stroke-width="1.2"/>
<text x="585.0" y="609.5" class="boxtext" text-anchor="middle" dominant-baseline="middle">Linear</text>
<text x="585.0" y="626.5" class="boxtext" text-anchor="middle" dominant-baseline="middle">4×side² → 2</text>
<line x1="585.0" y1="566" x2="585.0" y2="590" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="395" y="670" width="380" height="56" rx="8" fill="#E6E6E6" stroke="#222" stroke-width="1.2"/>
<text x="585.0" y="689.5" class="boxtext" text-anchor="middle" dominant-baseline="middle" font-weight="bold">二分类 logits</text>
<text x="585.0" y="706.5" class="boxtext" text-anchor="middle" dominant-baseline="middle">Attack / Normal</text>
<line x1="585.0" y1="646" x2="585.0" y2="670" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="800" y="290" width="250" height="140" rx="8" fill="#F2F2F2" stroke="#666" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="925.0" y="326.0" class="notetext" text-anchor="middle" dominant-baseline="middle">轻量化特征</text>
<text x="925.0" y="343.0" class="notetext" text-anchor="middle" dominant-baseline="middle">• 结构直线化，便于画图与复现</text>
<text x="925.0" y="360.0" class="notetext" text-anchor="middle" dominant-baseline="middle">• 参数层级少，突出部署友好</text>
<text x="925.0" y="377.0" class="notetext" text-anchor="middle" dominant-baseline="middle">• 与 TeacherV1</text>
<text x="925.0" y="394.0" class="notetext" text-anchor="middle" dominant-baseline="middle">形成复杂度对比</text>
<line x1="775" y1="298" x2="800" y2="360" stroke="#333" stroke-width="1.4" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
</svg>