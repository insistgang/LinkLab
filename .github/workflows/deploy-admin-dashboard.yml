name: Deploy Admin Dashboard

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-admin-dashboard.yml
      - linklab/admin_dashboard/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Install dependencies
        working-directory: linklab/admin_dashboard
        run: flutter pub get

      - name: Build web demo
        working-directory: linklab/admin_dashboard
        run: >
          flutter build web
          --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=LINKLAB_ADMIN_DEMO=true

      - name: Prepare Pages artifact
        working-directory: linklab/admin_dashboard
        run: |
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: linklab/admin_dashboard/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
