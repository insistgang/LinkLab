name: Deploy LinkLab App

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-admin-dashboard.yml
      - linklab/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/deploy-admin-dashboard.yml
      - linklab/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          cache: true

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Install dependencies
        working-directory: linklab
        run: flutter pub get

      - name: Analyze
        working-directory: linklab
        run: flutter analyze

      - name: Test quick tool layouts
        working-directory: linklab
        run: flutter test test/closed_loop/seeker_quick_tools_navigation_test.dart

      - name: Test large-text login layout
        working-directory: linklab
        run: >
          flutter test test/widget_test.dart
          --plain-name "登录页在窄屏和 200% 字体下不出现横向溢出"

      - name: Test
        working-directory: linklab
        run: flutter test

      - name: Build web app
        working-directory: linklab
        run: >
          flutter build web
          --release
          --base-href "/${{ github.event.repository.name }}/"

      - name: Prepare Pages artifact
        working-directory: linklab
        run: |
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: linklab/build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
