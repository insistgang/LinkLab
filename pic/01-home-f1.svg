<svg xmlns="http://www.w3.org/2000/svg"  viewBox="0 0 128 128" role="img" aria-labelledby="title-1">
  <title id="title-1">首页</title>
  <defs>
    <!-- Base body (top light → bottom deep) -->
    <linearGradient id="pBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D5BBFF"/>
      <stop offset="0.45" stop-color="#A86FFF"/>
      <stop offset="1" stop-color="#6B22D6"/>
    </linearGradient>
    <!-- Glass with diagonal highlight bloom -->
    <radialGradient id="pGlass" cx="32%" cy="22%" r="85%">
      <stop offset="0" stop-color="#F4E8FF"/>
      <stop offset="0.25" stop-color="#C9A4FF"/>
      <stop offset="0.7" stop-color="#8B43F5"/>
      <stop offset="1" stop-color="#5818BF"/>
    </radialGradient>
    <!-- Soft chubby fill, no extreme contrast -->
    <linearGradient id="pSoft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C8A2FF"/>
      <stop offset="1" stop-color="#7A2EEA"/>
    </linearGradient>
    <!-- Light tint for surfaces / accents on top of body -->
    <linearGradient id="pPale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2E5FF"/>
      <stop offset="1" stop-color="#C9A4FF"/>
    </linearGradient>
    <!-- Deep shadow underlay -->
    <linearGradient id="pShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b59ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5a18c0" stop-opacity="0.4"/>
    </linearGradient>
    <!-- White highlight dot -->
    <radialGradient id="hiDot" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Inner shine for spheres -->
    <radialGradient id="pSphere" cx="35%" cy="28%" r="78%">
      <stop offset="0" stop-color="#FBF1FF"/>
      <stop offset="0.3" stop-color="#C8A1FF"/>
      <stop offset="0.7" stop-color="#7A2EE6"/>
      <stop offset="1" stop-color="#4B0FA8"/>
    </radialGradient>
    <!-- Glow for color/sun -->
    <radialGradient id="pGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#DDBFFF"/>
      <stop offset="1" stop-color="#9448FF"/>
    </radialGradient>
    <!-- Used for hairline strokes on top -->
    <linearGradient id="pStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>

    <filter id="blurShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>
<!-- back shadow layer -->
        <path d="M40 60 L72 32 L104 60 L104 100 Q104 108 96 108 L48 108 Q40 108 40 100 Z"
          fill="url(#pShadow)" opacity="0.45" filter="url(#blurShadow)" transform="translate(6 7)"/>
        <!-- second layer -->
        <path d="M28 58 L60 30 L92 58 L92 98 Q92 106 84 106 L36 106 Q28 106 28 98 Z"
          fill="url(#pSoft)" opacity="0.55"/>
        <!-- main house -->
        <path d="M22 60 L60 26 L98 60 L98 102 Q98 110 90 110 L30 110 Q22 110 22 102 Z"
          fill="url(#pGlass)"/>
        <!-- door -->
        <rect x="50" y="76" width="20" height="34" rx="8" fill="url(#pPale)" opacity="0.85"/>
        <!-- chimney highlight -->
        <ellipse cx="42" cy="48" rx="9" ry="5" fill="url(#hiDot)" opacity="0.85"/>
</svg>
